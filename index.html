<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Global TV Max</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0D0F1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
/* Layout: rail lateral (escritorio/TV) + barra inferior (teléfono); rieles horizontales tipo guía de TV */
:root{
  --ink:#0D0F1E; --panel:#151933; --panel2:#1E2347; --line:#2B3164;
  --fg:#ECEEFF; --mute:#9CA2CC; --accent:#5FD4E8; --gold:#FFB547;
  --live:#FF4D63; --ok:#3DDC97; --warn:#F4C542;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.25rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);font-weight:600}
a{color:var(--accent)}

/* Shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--ink)}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.logo .mark{width:30px;height:30px;border-radius:8px;background:conic-gradient(from 200deg,var(--accent),var(--gold),var(--live),var(--accent));display:grid;place-items:center;color:var(--ink);font-size:.8rem}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mute);font-weight:600;text-align:left;width:100%}
.nav-btn svg{width:20px;height:20px;flex:none}
.nav-btn:hover{background:var(--panel);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--panel2);color:var(--fg)}
.nav-sep{height:1px;background:var(--line);margin:10px 8px}
main{min-width:0;padding-bottom:90px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:12px;align-items:center;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--ink) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-width:0}
.search input{flex:1;min-width:0;background:none;border:0;outline:0}
.search svg{width:18px;height:18px;color:var(--mute);flex:none}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:700;border:1px solid var(--line);flex:none}
.top .mlogo{display:none}
.view{padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px;max-width:1500px}
.bottom{display:none}

/* Hero */
.hero{position:relative;border-radius:18px;overflow:hidden;min-height:260px;display:flex;align-items:flex-end;padding:28px;isolation:isolate}
.hero .bg{position:absolute;inset:0;z-index:-1}
.hero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,15,30,.92) 0%,rgba(13,15,30,.55) 55%,rgba(13,15,30,.1))}
.hero h1{font-size:clamp(1.9rem,4.5vw,3.2rem);font-weight:800;line-height:1.02}
.hero p{max-width:52ch;color:#D5D8F5;margin:10px 0 16px}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* Buttons & chips */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.btn.accent{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.btn.danger{color:var(--live);border-color:color-mix(in srgb,var(--live) 50%,var(--line))}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn svg{width:18px;height:18px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mute);font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:6px;background:var(--panel2);color:var(--mute);text-transform:uppercase}
.tag.live{background:var(--live);color:#fff}
.tag.demo{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.tag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.tag.bad{color:var(--live);background:color-mix(in srgb,var(--live) 15%,transparent)}
.tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--mute)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--live)}.dot.warn{background:var(--warn)}

/* Rails */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,170px);gap:14px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.rail.wide{grid-auto-columns:minmax(250px,280px)}
.rail>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.grid.ch{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}

/* Poster card */
.poster{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.poster .art{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;border:1px solid rgba(255,255,255,.06);transition:transform .15s}
.poster:hover .art,.poster:focus-visible .art{transform:translateY(-3px)}
.poster .art b{font-family:var(--f-display);font-size:1.15rem;line-height:1.05;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.poster .art .q{position:absolute;top:8px;left:8px}
.poster .art .fav{position:absolute;top:8px;right:8px;color:var(--gold)}
.poster .cap{font-size:.85rem;color:var(--mute)}
.poster .cap strong{display:block;color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:3px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--accent)}

/* Channel tile */
.ch-tile{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);text-align:left;width:100%;min-width:0}
.ch-tile:hover{border-color:var(--mute)}
.ch-logo{width:54px;height:54px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1rem;color:#fff;overflow:hidden}
.ch-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.ch-tile .info{min-width:0}
.ch-tile .info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-tile .now{font-size:.82rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-tile .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.ch-tile.locked{opacity:.55}
.star{color:var(--mute);padding:6px}
.star[aria-pressed="true"]{color:var(--gold)}
.star svg{width:20px;height:20px}

/* Panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.note{border-left:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--panel));padding:12px 14px;border-radius:0 10px 10px 0;font-size:.9rem;color:#E6E1CC}
.empty{padding:30px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:.92rem}
.kv dt{color:var(--mute)}
.kv dd{margin:0;min-width:0}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.stat b{display:block;font-family:var(--f-display);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);background:var(--panel)}
tr:last-child td{border-bottom:0}
td .row-btns{gap:6px;flex-wrap:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{padding:10px 14px;color:var(--mute);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.82rem;color:var(--mute);font-weight:600}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=url],select,textarea{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;background:var(--ink);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:.85rem}
.err{color:var(--live);font-size:.88rem;min-height:1.2em}
.secret{display:flex;gap:8px;align-items:center;background:var(--ink);border:1px dashed var(--gold);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);word-break:break-all}

/* Modal */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(5,6,14,.72);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(760px,100%);max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.x{width:36px;height:36px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;flex:none}
.detail{display:grid;grid-template-columns:180px 1fr;gap:20px}
.detail .art{aspect-ratio:2/3;border-radius:12px;display:flex;align-items:flex-end;padding:12px;font-family:var(--f-display);font-weight:800;font-size:1.3rem}

/* Player */
.player{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
.player .bar{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(#000c,#0000);position:absolute;inset:0 0 auto;z-index:2;transition:opacity .3s}
.player .bar .ttl{flex:1;min-width:0}
.player .bar .ttl strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .stage{flex:1;display:grid;place-items:center;min-height:0}
.player video,.player canvas{width:100%;height:100%;object-fit:contain;background:#000}
.player .msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(520px,90vw);text-align:center;background:rgba(13,15,30,.92);border:1px solid var(--line);padding:18px;border-radius:14px;z-index:3}
.player .hud{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:2;font-family:var(--f-mono);font-size:.75rem;color:#cfd3ff;background:#0009;padding:6px 10px;border-radius:8px}
.player select{width:auto;padding:6px 10px;background:#0008}
.spinner{width:42px;height:42px;border:4px solid #fff3;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;position:absolute;left:50%;top:50%;margin:-21px 0 0 -21px;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}

/* Login */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login .art{position:relative;overflow:hidden;background:radial-gradient(circle at 30% 20%,#2a2f6b,transparent 60%),radial-gradient(circle at 80% 80%,#0f5866,transparent 55%),var(--ink);padding:48px;display:flex;flex-direction:column;justify-content:flex-end}
.login .art h1{font-size:clamp(2.2rem,5vw,4rem);font-weight:800;line-height:.98}
.login .art .wall{position:absolute;inset:40px 40px auto auto;display:grid;grid-template-columns:repeat(4,64px);gap:8px;opacity:.55;transform:rotate(-8deg)}
.login .art .wall span{height:42px;border-radius:6px}
.login form{align-self:center;justify-self:center;width:min(400px,100%);display:flex;flex-direction:column;gap:14px;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.demo-creds{font-size:.85rem;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.demo-creds code{font-family:var(--f-mono);color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:700;z-index:100;box-shadow:0 10px 30px #0008;max-width:90vw;text-align:center}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .top .mlogo{display:flex;padding:0}
  .top .mlogo span:last-child{display:none}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset:auto 0 0;z-index:40;background:color-mix(in srgb,var(--ink) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bottom .nav-btn{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 2px;align-items:center;text-align:center}
  .hero{min-height:220px;padding:20px}
  .detail{grid-template-columns:1fr}
  .detail .art{max-width:180px}
  .login{grid-template-columns:1fr}
  .login .art{min-height:230px;padding:24px max(16px,env(safe-area-inset-left,0px))}
  .login .art .wall{grid-template-columns:repeat(4,44px);inset:20px 10px auto auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="player-root"></div>
<div id="toast-root"></div>

<script>
"use strict";
/* ============================================================
   Global TV Max · v1.0 MVP (cliente)  — by Mr. Escudero / EIEL
   Datos locales de demostración. La versión con servidor
   (NestJS + PostgreSQL / Supabase) reemplaza la capa DB.
   ============================================================ */
const VERSION='1.0.0';
const DASH_LIB='https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const hashN=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const fmtDate=t=>t?new Date(t).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fmtDT=t=>t?new Date(t).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const fmtTime=t=>new Date(t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
const todayISO=(d=0)=>{const x=new Date(Date.now()+d*864e5);return x.toISOString().slice(0,10)};

/* ---------- Seguridad: hash de contraseñas ----------
   Cliente: PBKDF2-SHA256 (WebCrypto). Servidor (Fase 2): Argon2id. */
const enc=new TextEncoder();
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const PBKDF2_IT=120000;
async function hashPw(pw,salt,it=PBKDF2_IT){
  salt=salt||crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:it},key,256);
  return `pbkdf2$${it}$${b64(salt)}$${b64(bits)}`;
}
async function verifyPw(pw,stored){
  if(!stored)return false;const [,it,s,h]=stored.split('$');
  const r=(await hashPw(pw,unb64(s),+it)).split('$')[3];
  let d=r.length^h.length;for(let i=0;i<Math.min(r.length,h.length);i++)d|=r.charCodeAt(i)^h.charCodeAt(i);return d===0;
}
function genPassword(n=16){
  const cs='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%*-_';
  const out=[];const buf=new Uint8Array(1);
  while(out.length<n){crypto.getRandomValues(buf);if(buf[0]<cs.length*Math.floor(256/cs.length))out.push(cs[buf[0]%cs.length])}
  const p=out.join('');return(/[A-Z]/.test(p)&&/[a-z]/.test(p)&&/\d/.test(p))?p:genPassword(n);
}
function genUserId(){const b=crypto.getRandomValues(new Uint8Array(4));return 'GTM-'+[...b].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}
const pwPolicy=p=>p.length>=10&&/[A-Za-z]/.test(p)&&/\d/.test(p);

/* ---------- Catálogos base ---------- */
const PERMS={'users.manage':'Usuarios y suscripciones','admins.manage':'Administrar administradores','plans.manage':'Planes de acceso','channels.manage':'Canales y categorías','catalog.edit':'Metadatos, carteles y programación','stats.view':'Estadísticas','security.view':'Registros de actividad y seguridad','settings.manage':'Configuración, fuentes y seguridad'};
const ROLES={
  superadmin:{name:'Superadministrador',perms:Object.keys(PERMS)},
  admin:{name:'Administrador',perms:['users.manage','plans.manage','channels.manage','stats.view','security.view']},
  editor:{name:'Editor',perms:['catalog.edit']},
  user:{name:'Usuario',perms:[]}

function getDevice(){let d=LS.get('gtm_device',null);if(!d){const ua=navigator.userAgent;const name=/iPhone/.test(ua)?'iPhone':/iPad/.test(ua)?'iPad':/Android/.test(ua)&&/TV|AFT|BRAVIA/.test(ua)?'Android TV':/Android/.test(ua)?'Android':/Macintosh/.test(ua)?'Mac':/Windows/.test(ua)?'Windows':'Navegador';d={id:uid(),name:name+' · '+(/Edg/.test(ua)?'Edge':/Chrome/.test(ua)?'Chrome':/Safari/.test(ua)?'Safari':/Firefox/.test(ua)?'Firefox':'Web')};LS.set('gtm_device',d)}return d}

async function login(username,pw){
  const S=DB.settings;const u=DB.users.find(x=>x.username.toLowerCase()===username.trim().toLowerCase());
  if(!u){audit('anónimo','login_fallido',username,'usuario inexistente');save();return 'Usuario o contraseña incorrectos.'}
  if(u.lockedUntil>Date.now())return `Cuenta bloqueada por intentos fallidos. Intenta de nuevo en ${Math.ceil((u.lockedUntil-Date.now())/60000)} min.`;
  if(!(await verifyPw(pw,u.hash))){
    u.failed=(u.failed||0)+1;
    if(u.failed>=S.maxFailed){u.lockedUntil=Date.now()+S.lockMinutes*60000;u.failed=0;audit(u.username,'bloqueo_temporal',u.username,`${S.maxFailed} intentos fallidos`);save();return `Demasiados intentos. La cuenta quedó bloqueada ${S.lockMinutes} minutos.`}
    audit(u.username,'login_fallido',u.username,`intento ${u.failed} de ${S.maxFailed}`);save();return 'Usuario o contraseña incorrectos.';
  }
  if(u.status==='suspendida')return 'Esta cuenta está suspendida. Contacta al administrador.';
  if(u.expiresAt&&new Date(u.expiresAt+'T23:59:59')<new Date())return 'La cuenta venció. Pide al administrador que la renueve.';
  if(u.mustChange&&u.tempExpires&&u.tempExpires<Date.now())return 'La contraseña temporal venció. Pide una nueva al administrador.';
  const dev=getDevice();u.devices=u.devices||[];let d=u.devices.find(x=>x.id===dev.id);
  if(!d){const lim=maxDevicesFor(u);if(u.devices.length>=lim){audit(u.username,'limite_dispositivos',u.username,dev.name);save();return `Llegaste al límite de ${lim} dispositivo(s) de tu plan. Quita uno desde “Mi cuenta” en otro equipo o pide al administrador que lo libere.`}
    d={id:dev.id,name:dev.name,added:Date.now()};u.devices.push(d)}
  d.lastSeen=Date.now();u.failed=0;u.lockedUntil=0;u.lastLogin=Date.now();
  const s={id:uid(),userId:u.id,deviceId:dev.id,deviceName:dev.name,created:Date.now(),lastSeen:Date.now(),revoked:false};
  DB.sessions.unshift(s);if(DB.sessions.length>300)DB.sessions.length=300;
  LS.set('gtm_session',s.id);audit(u.username,'inicio_sesion',u.username,dev.name);save();ME=u;return null;
}
function logout(reason){const s=currentSession();if(s){s.revoked=true;s.ended=Date.now()}if(ME)audit(ME.username,'cierre_sesion',ME.username,reason||'');save();LS.del('gtm_session');ME=null;closePlayer();closeModal();renderApp();if(reason)toast(reason)}
function checkSession(){
  const s=currentSession();if(!s||s.revoked)return null;const u=DB.users.find(x=>x.id===s.userId);
  if(!u||u.status!=='activa'||(u.expiresAt&&new Date(u.expiresAt+'T23:59:59')<new Date()))return null;
  if(!u.devices?.some(d=>d.id===s.deviceId))return null;
  s.lastSeen=Date.now();return u;
}

function allChannels(){return visibleChannels().concat((ME?.m3u||[]).flatMap(l=>l.channels.map(c=>({...c,listId:l.id}))))}
function parseM3U(text){
  const lines=text.replace(/\r/g,'').split('\n');const out=[];let cur=null;
  if(!/^#EXTM3U/i.test(lines[0]?.trim()||''))throw new Error('El archivo no empieza con #EXTM3U. Verifica que sea una lista M3U válida.');
  for(const raw of lines){const l=raw.trim();if(!l)continue;
    if(l.startsWith('#EXTINF')){const attr=k=>(l.match(new RegExp(k+'="([^"]*)"','i'))||[])[1]||'';cur={name:(l.split(',').slice(1).join(',')||attr('tvg-name')||'Canal').trim(),logo:attr('tvg-logo'),group:attr('group-title')||'Sin grupo',tvgId:attr('tvg-id'),country:(attr('tvg-country')||'INT').toUpperCase().slice(0,5)}}
    else if(!l.startsWith('#')){const url=l;if(!/^https?:\/\//i.test(url)){cur=null;continue}const c=cur||{name:url.split('/').pop(),group:'Sin grupo',country:'INT'};
      out.push({id:'m3u-'+hashN(url+c.name).toString(36),name:c.name.slice(0,120),logo:/^https?:\/\//.test(c.logo)?c.logo:'',group:c.group.slice(0,60),country:c.country,cat:'m3u',lang:'',url,format:/\.mpd(\?|$)/i.test(url)?'dash':'hls',type:'m3u',health:'sin verificar',epg:false,enabled:true,validation:'aprobada'});cur=null}}
  return out;
}

   ${all.length?`<div class="chips"><button class="chip" data-act="m3uGroup" data-k="all" aria-pressed="${ST.m3uGroup==='all'}">Todos (${all.length})</button>${groups.map(g=>`<button class="chip" data-act="m3uGroup" data-k="${esc(g)}" aria-pressed="${ST.m3uGroup===g}">${esc(g)}</button>`).join('')}</div>

    let text='',source='';
    if(txt){text=txt;source='Texto pegado'}else if(file){if(file.size>15e6)throw new Error('El archivo pesa más de 15 MB.');text=await file.text();source='Archivo: '+file.name}
    else if(url){try{text=await fetchText(url)}catch(e){throw new Error('No se pudo descargar la lista ('+e.message+'). Algunos servidores bloquean la descarga desde el navegador o la vista previa; súbela como archivo o pega su contenido.')}source=new URL(url).host}
    else throw new Error('Agrega un enlace, un archivo o pega el contenido de la lista.');
    const all=parseM3U(text);const chans=onlyCompatible(all);if(all.length&&!chans.length)throw new Error('Todos los canales de la lista usan enlaces http, que el navegador bloquea en sitios https. Pide a tu proveedor enlaces https.');if(!chans.length)throw new Error('La lista no contiene canales con enlaces http/https.');
    ME.m3u=ME.m3u||[];ME.m3u.push({id:uid(),name,url:txt||file?'':url,source,updated:Date.now(),channels:chans.slice(0,5000)});

/* ---------- Reproductor ---------- */
let P={hls:null,dash:null,stop:null,retry:0,t0:0,src:null,saveT:0};
function loadScript(src){return new Promise((ok,ko)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
function playChannel(id){
  const c=allChannels().find(x=>x.id===id);if(!c)return;
  if(!catAllowed(c.cat)&&c.type!=='m3u'){toast(`“${CATS[c.cat]}” no está incluido en tu ${planOf(ME).name}.`);return}
  if(c.type==='link'){window.open(c.link,'_blank','noopener')||toast('Abre el enlace oficial: '+c.link);return}
  const now=epgFor(c,1)[0];
  openPlayer({id:c.id,kind:'channel',name:c.name,sub:now?`Ahora: ${now.title}`:(c.group||CATS[c.cat]||''),url:c.url,format:c.format,live:true});
}
function playTitle(id){const t=DB.titles.find(x=>x.id===id);if(!t||!t.url)return;closeModal();openPlayer({id:t.id,kind:'title',name:t.title,sub:`${t.year} · ${t.genres.join(', ')}`,url:t.url,format:t.format})}
function openPlayer(src){
  closePlayer();P={hls:null,dash:null,stop:null,retry:0,t0:performance.now(),src,saveT:0};
  DB.stats.plays[src.id]=(DB.stats.plays[src.id]||0)+1;save();
  $('#player-root').innerHTML=`<div class="player" role="dialog" aria-label="Reproductor">
    <div class="bar"><button class="x" data-act="closePlayer" aria-label="Cerrar reproductor">${ic('x')}</button>
     <div class="ttl"><strong>${esc(src.name)}</strong><small class="mute">${esc(src.sub||'')}</small></div>
     ${src.live?'<span class="tag live">En vivo</span>':''}
     <select id="pq" aria-label="Calidad" hidden><option value="-1">Automática</option></select></div>
    <div class="stage" id="stage">${src.format==='canvas'?'<canvas id="pc" aria-label="Señal de prueba"></canvas>':'<video id="pv" controls playsinline autoplay></video><div class="spinner" id="psp"></div>'}</div>
    <div class="hud" id="hud">Conectando…</div></div>`;
  if(src.format==='canvas'){P.stop=drawPattern($('#pc'),src.name);$('#hud').textContent='Señal generada · 1280×720';markHealth(src,'en línea');return}
  const v=$('#pv');
  v.addEventListener('playing',()=>{const ms=Math.round(performance.now()-P.t0);$('#psp')?.remove();DB.stats.starts.unshift(ms);DB.stats.starts.length=Math.min(DB.stats.starts.length,50);markHealth(src,'en línea');updHud(v,ms)},{once:true});
  v.addEventListener('waiting',()=>{if(!$('#psp'))$('#stage').insertAdjacentHTML('beforeend','<div class="spinner" id="psp"></div>')});
  v.addEventListener('playing',()=>$('#psp')?.remove());
  v.addEventListener('resize',()=>updHud(v));
  if(src.kind==='title'){
    v.addEventListener('loadedmetadata',()=>{const h=ME.history[src.id];if(h&&h.pos>10&&h.pos<v.duration-30)v.currentTime=h.pos});
    v.addEventListener('timeupdate',()=>{if(Date.now()-P.saveT<5000||!v.duration)return;P.saveT=Date.now();ME.history[src.id]={pos:v.currentTime,dur:v.duration,t:Date.now()};save()});
  }
  attach(v,src);
}
function updHud(v,ms){const h=$('#hud');if(!h)return;if(ms!==undefined)P.startMs=ms;h.textContent=`${v.videoWidth?v.videoWidth+'×'+v.videoHeight:'—'} · inicio ${P.startMs!=null?(P.startMs/1000).toFixed(1)+' s':'—'} · ${P.src.format.toUpperCase()}`}
function attach(v,src){
  if(src.format==='dash'){loadScript(DASH_LIB).then(()=>{P.dash=dashjs.MediaPlayer().create();P.dash.initialize(v,src.url,true);P.dash.on('error',()=>fail(src))}).catch(()=>fail(src,'No se pudo cargar el módulo DASH.'));return}
  if(window.Hls&&Hls.isSupported()){
    const h=P.hls=new Hls({maxBufferLength:30,enableWorker:true});h.loadSource(src.url);h.attachMedia(v);
    h.on(Hls.Events.MANIFEST_PARSED,(e,d)=>{const q=$('#pq');if(q&&d.levels.length>1){q.hidden=false;q.innerHTML='<option value="-1">Automática</option>'+d.levels.map((l,i)=>`<option value="${i}">${l.height?l.height+'p':Math.round(l.bitrate/1000)+' kbps'}</option>`).join('')}v.play().catch(()=>{})});
    h.on(Hls.Events.ERROR,(e,d)=>{if(!d.fatal)return;
      if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&P.retry<2){P.retry++;h.recoverMediaError();return}
      if(P.retry<2){P.retry++;$('#hud').textContent=`Reintentando (${P.retry}/2)…`;setTimeout(()=>{if(P.hls===h)h.loadSource(src.url)},1500*P.retry);return}
      fail(src)});
  }else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=src.url;v.onerror=()=>fail(src);v.play().catch(()=>{})}
  else fail(src,'Este navegador no puede reproducir HLS.');
}
function fail(src,why){
  DB.stats.fails[src.id]=(DB.stats.fails[src.id]||0)+1;markHealth(src,'caída');
  $('#psp')?.remove();$('#stage')?.insertAdjacentHTML('beforeend',`<div class="msg"><h3 style="margin-bottom:8px">No se pudo reproducir esta fuente</h3><p class="mute" style="margin:0 0 12px">${esc(why||'La fuente no respondió o está fuera de línea.')} Si estás viendo la app dentro de la vista previa de Claude, los videos externos están bloqueados ahí; ábrela desde tu sitio publicado (por ejemplo GitHub Pages).</p><div class="row-btns" style="justify-content:center"><button class="btn primary" data-act="retryPlay">Reintentar</button><button class="btn" data-act="closePlayer">Cerrar</button></div></div>`);
}
function markHealth(src,h){if(src.kind!=='channel')return;const c=DB.channels.find(x=>x.id===src.id)||(ME.m3u||[]).flatMap(l=>l.channels).find(x=>x.id===src.id);if(c&&c.type!=='link'){c.health=h;c.checked=Date.now();save()}}
function closePlayer(){try{P.hls?.destroy()}catch(e){}try{P.dash?.reset()}catch(e){}P.stop&&P.stop();const v=$('#pv');if(v){v.pause();v.removeAttribute('src');v.load()}$('#player-root').innerHTML='';P.hls=P.dash=P.stop=null;if(ME&&VIEW!=='admin')renderView()}
function drawPattern(cv,label){
  const ctx=cv.getContext('2d');const W=cv.width=1280,H=cv.height=720;let raf;
  const top=['#c0c0c0','#c0c000','#00c0c0','#00c000','#c000c0','#c00000','#0000c0'],mid=['#0000c0','#131313','#c000c0','#131313','#00c0c0','#131313','#c0c0c0'];
  const f=()=>{const bw=W/7;top.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(i*bw,0,bw+1,H*.67)});mid.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(i*bw,H*.67,bw+1,H*.08)});
    ctx.fillStyle='#0d0f1e';ctx.fillRect(0,H*.75,W,H*.25);ctx.fillStyle='rgba(13,15,30,.88)';ctx.fillRect(W/2-270,H*.33-62,540,124);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='700 66px "JetBrains Mono",monospace';ctx.fillText(new Date().toLocaleTimeString('es-MX'),W/2,H*.33);
    ctx.font='700 34px "Bricolage Grotesque",sans-serif';ctx.fillText(label,W/2,H*.85);ctx.font='500 22px Figtree,sans-serif';ctx.fillStyle='#9CA2CC';ctx.fillText('Global TV Max · señal de prueba · '+new Date().toLocaleDateString('es-MX'),W/2,H*.93);raf=requestAnimationFrame(f)};
  f();return()=>cancelAnimationFrame(raf);
}

async function saveUser(form){
  const err=$('#uf-err');const id=form.dataset.id;const val=k=>$('#uf-'+k)?.value.trim();
  const role=val('role');if(!can('admins.manage')&&!['user','editor'].includes(role)){err.textContent='No tienes permiso para asignar ese rol.';return}
  if(id){const u=DB.users.find(x=>x.id===id);if(!canTouch(u))return;const before=JSON.stringify([u.role,u.planId,u.status,u.expiresAt]);
    Object.assign(u,{name:val('name'),email:val('email'),role,planId:val('plan'),expiresAt:val('exp'),maxDevices:+val('dev')||0,status:val('status')});
    if(u.status==='suspendida')revokeUser(u,false);audit(ME.username,'usuario_editado',u.username,before+' → '+JSON.stringify([u.role,u.planId,u.status,u.expiresAt]));save();closeModal();toast('Usuario actualizado');renderView();return}
  const username=val('user').toLowerCase();if(DB.users.some(x=>x.username.toLowerCase()===username)){err.textContent='Ese nombre de usuario ya existe.';return}
  const manual=val('pwmode')==='manual';let pw=manual?$('#uf-pw').value:genPassword();
  if(manual&&!pwPolicy(pw)){err.textContent='La contraseña manual necesita mínimo 10 caracteres, con letras y números.';return}
  const u={id:uid(),code:genUserId(),username,name:val('name'),email:val('email'),role,planId:val('plan'),status:val('status'),expiresAt:val('exp'),maxDevices:+val('dev')||0,hash:await hashPw(pw),mustChange:!manual,tempExpires:manual?0:Date.now()+DB.settings.tempHours*36e5,failed:0,lockedUntil:0,lastLogin:0,devices:[],created:Date.now(),favorites:[],history:{},prefs:{maxRating:'D',autoplay:true,lang:'es'},m3u:[]};
  DB.users.push(u);audit(ME.username,'usuario_creado',u.username,`${ROLES[role].name} · ${planOf(u).name}`);save();renderView();
  if(manual){closeModal();toast('Usuario creado')}else showSecret(u,pw);pw=null;
}

   <div class="art"><div class="wall" aria-hidden="true">${wall}</div><div class="eyebrow" style="color:#bfe9f1">México · Estados Unidos · El mundo</div><h1>Global<br>TV Max</h1><p class="mute" style="max-width:40ch">Televisión en vivo, cine y tus plataformas en un solo lugar.</p></div>
   <form data-form="login">
    <h2 style="font-size:1.6rem">Iniciar sesión</h2>
    <div class="field"><label for="lg-user">Usuario</label><input id="lg-user" type="text" required autocomplete="username" autocapitalize="none"></div>
    <div class="field"><label for="lg-pw">Contraseña</label><input id="lg-pw" type="password" required autocomplete="current-password"></div>
    <div class="err" id="lg-err" role="alert"></div>
    <button class="btn accent" type="submit" style="justify-content:center">Entrar</button>
    <div class="demo-creds"><div class="eyebrow" style="margin-bottom:6px">Cuentas de demostración</div>
     Superadministrador: <code>admin</code> / <code>GlobalTV-Demo-2026</code><br>Editor: <code>editor</code> / <code>Editor-Demo-2026</code><br>Usuario (Plan Básico): <code>demo</code> / <code>Demo-2026-tv</code></div>
    <small class="mute">¿Olvidaste tu contraseña? Pide al administrador una contraseña temporal.</small>
   </form></div>`;
  setTimeout(()=>$('#lg-user')?.focus(),30);
}

/* ---------- Eventos ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id,k=el.dataset.k;
  if(a==='overlay'){if(e.target===el)closeModal();return}
  switch(a){
    case 'go':go(el.dataset.v);break;
    case 'closeModal':closeModal();break;
    case 'closePlayer':closePlayer();break;
    case 'retryPlay':{const s=P.src;closePlayer();openPlayer(s);break}
    case 'title':titleModal(id);break;
    case 'play':playTitle(id);break;
    case 'channel':playChannel(id);break;
    case 'fav':{const i=ME.favorites.indexOf(id);i>=0?ME.favorites.splice(i,1):ME.favorites.push(id);save();toast(i>=0?'Quitado de favoritos':'Agregado a favoritos');if($('.modal')&&DB.titles.some(t=>t.id===id))titleModal(id);renderView();break}
    case 'quickCat':{const c=visibleChannels().find(x=>x.cat===el.dataset.cat);ST.liveCountry=c?(['MX','US'].includes(c.country)?c.country:'otros'):'MX';ST.liveCat=el.dataset.cat;go('live');break}
    case 'liveCountry':ST.liveCountry=k;ST.liveCat='all';renderView();break;
    case 'liveCat':ST.liveCat=k;renderView();break;
    case 'genre':ST.movieGenre=k;renderView();break;
    case 'm3uAdd':m3uModal();break;
    case 'm3uPreset':loadPreset(k);break;
    case 'm3uGroup':ST.m3uGroup=k;renderView();break;
    case 'm3uDel':{const l=ME.m3u.find(x=>x.id===id);ME.m3u=ME.m3u.filter(x=>x.id!==id);ME.favorites=ME.favorites.filter(f=>!l.channels.some(c=>c.id===f));ST.m3uGroup='all';audit(ME.username,'lista_m3u_quitada',l.name);save();renderView();toast('Lista quitada');break}
    case 'm3uRefresh':{const l=ME.m3u.find(x=>x.id===id);try{const ch=parseM3U(await fetchText(l.url));l.channels=ch.slice(0,5000);l.updated=Date.now();save();renderView();toast(`Lista actualizada: ${ch.length} canales`)}catch(err){toast('No se pudo actualizar: '+err.message)}break}
    case 'logout':logout();break;
    case 'pwChange':pwModal(false);break;
    case 'myDevDel':ME.devices=ME.devices.filter(d=>d.id!==id);DB.sessions.filter(s=>s.userId===ME.id&&s.deviceId===id).forEach(s=>s.revoked=true);audit(ME.username,'dispositivo_quitado',ME.username,id);save();renderView();toast('Dispositivo quitado');break;
    case 'copy':copyText(el.dataset.t);break;
    case 'adminTab':ST.adminTab=k;ST.sel.clear();renderView();break;
    case 'userNew':userModal();break;
    case 'userEdit':userModal(id);break;
    case 'userTemp':{const u=DB.users.find(x=>x.id===id);if(!canTouch(u))break;const pw=genPassword();u.hash=await hashPw(pw);u.mustChange=true;u.tempExpires=Date.now()+DB.settings.tempHours*36e5;u.lockedUntil=0;u.failed=0;revokeUser(u,false);audit(ME.username,'contrasena_temporal',u.username,'restablecida por administrador');save();renderView();showSecret(u,pw);break}
    case 'userToggle':{const u=DB.users.find(x=>x.id===id);if(!canTouch(u))break;u.status=u.status==='activa'?'suspendida':'activa';if(u.status==='suspendida')revokeUser(u,false);audit(ME.username,u.status==='activa'?'cuenta_reactivada':'cuenta_suspendida',u.username);save();renderView();toast(u.status==='activa'?'Cuenta reactivada':'Cuenta suspendida');break}
    case 'userRevoke':{const u=DB.users.find(x=>x.id===id);if(!canTouch(u))break;revokeUser(u,true);audit(ME.username,'sesiones_revocadas',u.username,'sesiones y dispositivos');save();renderView();toast('Sesiones y dispositivos revocados');break}
    case 'usersCsv':{const rows=[['id','usuario','nombre','correo','rol','plan','estado','vence','ultimo_acceso','dispositivos']].concat(usersFiltered().map(u=>[u.code,u.username,u.name,u.email,ROLES[u.role].name,planOf(u).name,u.status,u.expiresAt,u.lastLogin?new Date(u.lastLogin).toISOString():'',u.devices.length]));copyText(rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'));audit(ME.username,'reporte_exportado','usuarios','CSV sin contraseñas');save();break}
    case 'bulk':{let n=0;ST.sel.forEach(uid2=>{const u=DB.users.find(x=>x.id===uid2);if(u&&canTouch(u)){u.status=k;if(k==='suspendida')revokeUser(u,false);n++}});audit(ME.username,'accion_masiva',`${n} usuarios`,k);ST.sel.clear();save();renderView();toast(`${n} cuentas actualizadas`);break}
    case 'bulkClear':ST.sel.clear();renderView();break;
    case 'uPage':ST.uPage+=+k;renderView();break;
    case 'planEdit':planModal(id);break;
    case 'chEdit':chModal(id);break;
    case 'tEdit':tModal(id);break;
    case 'sesRevoke':{const s=DB.sessions.find(x=>x.id===id);s.revoked=true;s.ended=Date.now();audit(ME.username,'sesion_revocada',DB.users.find(u=>u.id===s.userId)?.username||'',s.deviceName);save();if(s.id===currentSession()?.id){logout('Cerraste tu propia sesión');break}renderView();break}
    case 'resetAsk':$('#reset-confirm').innerHTML='<div class="note">¿Seguro? Esta acción no se puede deshacer. <button class="btn sm danger" data-act="resetDo">Sí, restablecer</button></div>';break;
    case 'resetDo':LS.del(DB_KEY);LS.del('gtm_session');await seedDB();ME=null;renderApp();toast('Datos de demostración restablecidos');break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-sel]')){t.checked?ST.sel.add(t.dataset.sel):ST.sel.delete(t.dataset.sel);renderView();return}
  if(t.id==='u-status'){ST.uStatus=t.value;ST.uPage=0;renderView()}
  if(t.id==='u-role'){ST.uRole=t.value;ST.uPage=0;renderView()}
  if(t.id==='pq'&&P.hls){P.hls.currentLevel=+t.value}
});
let qT;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){clearTimeout(qT);qT=setTimeout(()=>{ST.q=t.value;renderView()},180)}
  if(t.id==='u-q'||t.id==='a-q'){clearTimeout(qT);qT=setTimeout(()=>{if(t.id==='u-q'){ST.uQ=t.value;ST.uPage=0}else ST.auditQ=t.value;const pos=t.selectionStart;renderView();const n=$('#'+t.id);if(n){n.focus();n.setSelectionRange(pos,pos)}},250)}
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const kind=f.dataset.form;
  if(kind==='login'){const btn=f.querySelector('button[type=submit]');btn.disabled=true;$('#lg-err').textContent='Verificando…';const err=await login($('#lg-user').value,$('#lg-pw').value);btn.disabled=false;if(err){$('#lg-err').textContent=err;return}
    VIEW='home';renderApp();if(ME.mustChange)pwModal(true);else toast('Bienvenido, '+(ME.name||ME.username).split(' ')[0]);return}
  if(kind==='pw'){const err=$('#pw-err');const cur=$('#pw-cur');if(cur&&!(await verifyPw(cur.value,ME.hash))){err.textContent='La contraseña actual no es correcta.';return}
    const n=$('#pw-new').value;if(!pwPolicy(n)){err.textContent='Usa mínimo 10 caracteres, con letras y números.';return}if(n!==$('#pw-new2').value){err.textContent='Las contraseñas no coinciden.';return}
    ME.hash=await hashPw(n);ME.mustChange=false;ME.tempExpires=0;audit(ME.username,'contrasena_cambiada',ME.username);save();closeModal();toast('Contraseña actualizada');return}
  if(kind==='m3u'){submitM3U();return}
  if(kind==='prefs'){ME.prefs={...ME.prefs,maxRating:$('#pf-rating').value,autoplay:$('#pf-auto').value==='1'};save();toast('Preferencias guardadas');return}
  if(kind==='user'){saveUser(f);return}
  if(kind==='plan'){if(!can('plans.manage'))return;const id=f.dataset.id;const cats=[...f.querySelectorAll('[name=pl-cat]:checked')].map(x=>x.value);
    const data={name:$('#pl-name').value.trim(),price:+$('#pl-price').value,currency:$('#pl-cur').value,days:+$('#pl-days').value,devices:+$('#pl-dev').value,simultaneous:+$('#pl-sim').value,limits:$('#pl-lim').value.trim(),active:$('#pl-act').value==='1',categories:cats.includes('all')?['all']:cats};
    if(id)Object.assign(DB.plans.find(p=>p.id===id),data);else DB.plans.push({id:uid(),...data});audit(ME.username,id?'plan_editado':'plan_creado',data.name,`${data.price} ${data.currency}`);save();closeModal();renderView();toast('Plan guardado');return}
  if(kind==='channel'){if(!can('channels.manage'))return;const id=f.dataset.id;const fmt=$('#cf-format').value,url=$('#cf-url').value.trim();
    const data={name:$('#cf-name').value.trim(),country:$('#cf-country').value,cat:$('#cf-cat').value,lang:$('#cf-lang').value.trim(),format:fmt,quality:$('#cf-quality').value,authorization:$('#cf-auth').value.trim(),validation:$('#cf-val').value,enabled:$('#cf-en').value==='1',epg:$('#cf-epg').value==='1',type:fmt==='link'?'link':'stream'};
    if(fmt==='link'){data.link=url;data.url=''}else if(fmt!=='canvas'){data.url=url;data.link=''}
    if(id){const c=DB.channels.find(x=>x.id===id);if(c.url!==data.url&&fmt!=='link')data.health='sin verificar';Object.assign(c,data)}else DB.channels.push({id:'ch-'+uid().slice(0,8),health:fmt==='link'?'externo':'sin verificar',...data});
    audit(ME.username,id?'canal_editado':'canal_agregado',data.name,`validación: ${data.validation}`);save();closeModal();renderView();toast('Canal guardado');return}
  if(kind==='title'){if(!can('catalog.edit'))return;const id=f.dataset.id;const v=k=>$('#tf-'+k).value.trim();
    const data={title:v('title'),original:v('original')||v('title'),type:v('type'),year:+v('year'),duration:+v('duration'),genres:v('genres').split(',').map(s=>s.trim()).filter(Boolean),director:v('director'),cast:v('cast'),langs:v('langs'),subs:v('subs'),rating:v('rating'),quality:v('quality'),provider:v('provider'),countries:v('countries'),license:v('license'),url:v('url'),link:v('link')||PROVIDERS.find(p=>p.id===v('provider'))?.url,synopsis:v('synopsis'),format:'hls'};
    if(!data.title){toast('El título es obligatorio');return}if(!data.genres.length)data.genres=['Sin género'];
    if(id)Object.assign(DB.titles.find(t=>t.id===id),data);else DB.titles.push({id:'t-'+uid().slice(0,8),...data});audit(ME.username,id?'titulo_editado':'titulo_agregado',data.title);save();closeModal();renderView();toast('Título guardado');return}
  if(kind==='settings'){if(!can('settings.manage'))return;Object.assign(DB.settings,{maxFailed:+$('#s-max').value,lockMinutes:+$('#s-lock').value,tempHours:+$('#s-temp').value,staffDevices:+$('#s-staff').value});audit(ME.username,'ajustes_seguridad','sistema',JSON.stringify(DB.settings));save();toast('Ajustes guardados');return}
});

/* ---------- Navegación con control remoto (flechas) ---------- */
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(e.key==='Escape'||(e.key==='Backspace'&&!typing)||e.key==='GoBack'){if($('#player-root').innerHTML){closePlayer();e.preventDefault()}else if($('#modal-root .overlay[data-act="overlay"]')){closeModal();e.preventDefault()}return}
  const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(!dirs[e.key]||typing)return;
  const scope=$('#player-root .player')||$('#modal-root .modal')||document;
  const items=[...scope.querySelectorAll('button:not([disabled]),a[href],input,select,textarea')].filter(el=>{const r=el.getBoundingClientRect();return r.width&&r.height&&!el.closest('[hidden]')});
  const cur=document.activeElement;if(!cur||cur===document.body||!scope.contains(cur)){items[0]?.focus();e.preventDefault();return}
  const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,[dx,dy]=dirs[e.key];let best=null,bs=Infinity;
  for(const el of items){if(el===cur)continue;const b=el.getBoundingClientRect();const x=b.left+b.width/2-cx,y=b.top+b.height/2-cy;const along=x*dx+y*dy;if(along<=4)continue;const s=along+(Math.abs(x*dy)+Math.abs(y*dx))*2.2;if(s<bs){bs=s;best=el}}
  if(best){e.preventDefault();best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}
});

/* ---------- Arranque ---------- */
(async function boot(){
  try{
    DB=LS.get(DB_KEY,null);
    if(!DB||DB.version!==1){$('#app').innerHTML='<div class="empty" style="margin:40px">Preparando datos de demostración…</div>';await seedDB()}
    ME=checkSession();if(ME)save();
    const h=(location.hash||'').slice(1);if(['home','live','movies','series','m3u','providers','favorites','account','settings','admin'].includes(h))VIEW=h;
    renderApp();if(ME?.mustChange)pwModal(true);
  }catch(err){$('#app').innerHTML=`<div class="empty" style="margin:40px">No se pudo iniciar la app: ${esc(err.message)}. Ábrela en un navegador moderno con HTTPS.</div>`}
})();
</script>
