name: Actualizar listas de canales
on:
  schedule:
    - cron: "17 9 * * *"   # diario, 3:17 a. m. hora de Cd. Juárez
  workflow_dispatch:
permissions:
  contents: write
jobs:
  listas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar listas públicas de iptv-org
        run: |
          mkdir -p listas
          curl -fsSL https://iptv-org.github.io/iptv/countries/mx.m3u -o listas/mx.m3u
          curl -fsSL https://iptv-org.github.io/iptv/countries/us.m3u -o listas/us.m3u
          curl -fsSL https://iptv-org.github.io/iptv/languages/spa.m3u -o listas/spa.m3u
      - name: Quitar canales de TV de paga
        run: python3 tools/filtrar_listas.py listas/*.m3u
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add listas
          git diff --cached --quiet || git commit -m "Listas de canales actualizadas"
          git push
